<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Neon Bio IMAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column app, glass panels floating over a dark glowing lab background, bottom tab bar */
:root {
  --bg: #070a17;
  --bg2: #0d1226;
  --panel: rgba(22, 28, 58, .62);
  --line: rgba(140, 160, 255, .16);
  --fg: #e9edff;
  --muted: #98a0c8;
  --cyan: #35f2e0;
  --violet: #a78bfa;
  --pink: #ff5fd2;
  --lime: #9dff7a;
  --red: #ff6b8b;
  --amber: #ffd166;
  --font-d: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-b: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-m: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-b); font-size: 15.5px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 110px; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.glow-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: radial-gradient(1200px 600px at 50% -10%, #141b3d 0%, var(--bg) 60%); }
.glow-bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45; animation: drift 18s ease-in-out infinite alternate; }
.glow-bg i:nth-child(1) { width: 340px; height: 340px; background: var(--cyan); top: -120px; left: -100px; opacity: .22; }
.glow-bg i:nth-child(2) { width: 300px; height: 300px; background: var(--pink); top: 40%; right: -140px; opacity: .16; animation-delay: -6s; }
.glow-bg i:nth-child(3) { width: 280px; height: 280px; background: var(--violet); bottom: -120px; left: 20%; opacity: .2; animation-delay: -12s; }
.glow-bg::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 44px 44px; opacity: .25; mask-image: radial-gradient(circle at 50% 20%, #000 0%, transparent 70%); }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; background: linear-gradient(var(--bg) 70%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-weight: 800; font-size: 19px; letter-spacing: .2px; cursor: pointer; background: none; border: 0; color: var(--fg); padding: 0; }
.brand svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px var(--cyan)); }
.brand b { color: var(--cyan); text-shadow: 0 0 14px rgba(53, 242, 224, .7); }
.brand small { font-family: var(--font-m); font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: linear-gradient(90deg, var(--violet), var(--pink)); color: #12081f; letter-spacing: 1px; }
.top-meta { font-family: var(--font-m); font-size: 12px; color: var(--muted); }

h1, h2, h3, h4 { font-family: var(--font-d); text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: clamp(26px, 6vw, 36px); font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
h4 { font-size: 14px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 6px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-m); }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 18px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.neon-text { background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.btn { font-family: var(--font-d); font-weight: 700; font-size: 14.5px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--fg); padding: 11px 16px; cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s; }
.btn:hover { background: rgba(255, 255, 255, .08); }
.btn:active { transform: scale(.97); }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.primary { background: linear-gradient(135deg, var(--cyan), #5aa8ff 60%, var(--violet)); color: #06101c; border: 0; box-shadow: 0 0 22px rgba(53, 242, 224, .45); }
.btn.primary:hover { box-shadow: 0 0 32px rgba(53, 242, 224, .7); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { font-family: var(--font-b); font-weight: 600; font-size: 13.5px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--muted); cursor: pointer; }
.chip.on { color: var(--cyan); border-color: var(--cyan); background: rgba(53, 242, 224, .08); box-shadow: 0 0 14px rgba(53, 242, 224, .3); }
.badge { font-family: var(--font-m); font-size: 11px; font-weight: 700; letter-spacing: .6px; padding: 3px 9px; border-radius: 8px; background: rgba(167, 139, 250, .14); color: var(--violet); border: 1px solid rgba(167, 139, 250, .3); }
.badge.cy { color: var(--cyan); background: rgba(53, 242, 224, .1); border-color: rgba(53, 242, 224, .3); }
.badge.pk { color: var(--pink); background: rgba(255, 95, 210, .1); border-color: rgba(255, 95, 210, .3); }
.badge.ok { color: var(--lime); background: rgba(157, 255, 122, .1); border-color: rgba(157, 255, 122, .3); }

/* Home */
.hero { padding: 22px 18px; position: relative; overflow: hidden; }
.hero p { margin-top: 8px; max-width: 52ch; }
.ch-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; cursor: pointer; transition: transform .2s, box-shadow .2s, border-color .2s; text-align: left; width: 100%; color: var(--fg); font: inherit; }
.ch-card:hover { transform: translateY(-2px); border-color: rgba(53, 242, 224, .5); box-shadow: 0 0 26px rgba(53, 242, 224, .2); }
.ch-num { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; font-size: 22px; color: #06101c; background: linear-gradient(135deg, var(--cyan), var(--violet)); box-shadow: 0 0 20px rgba(53, 242, 224, .5); }
.ch-card.locked { opacity: .45; cursor: default; }
.ch-card.locked:hover { transform: none; box-shadow: none; border-color: var(--line); }
.ch-card.locked .ch-num { background: rgba(255, 255, 255, .08); color: var(--muted); box-shadow: none; }
.ring { width: 52px; height: 52px; }
.ring circle { fill: none; stroke-width: 6; }

/* Chapter header + tabs */
.ch-head { display: flex; gap: 12px; align-items: flex-start; }
.back { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--fg); cursor: pointer; font-size: 18px; }
nav.tabs { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; }
nav.tabs .bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; width: 100%; max-width: 620px; padding: 6px; border-radius: 22px; background: rgba(13, 18, 38, .88); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; border-radius: 16px; border: 0; background: none; color: var(--muted); font-family: var(--font-b); font-size: 11px; font-weight: 600; cursor: pointer; position: relative; min-width: 0; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--cyan); background: rgba(53, 242, 224, .09); }
.tab.on svg { filter: drop-shadow(0 0 6px var(--cyan)); }
.tab .dot { position: absolute; top: 4px; right: 22%; min-width: 17px; height: 17px; border-radius: 9px; background: var(--pink); color: #1a0016; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 10px var(--pink); }

/* Review */
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; color: var(--fg); width: 100%; text-align: left; padding: 0; font: inherit; }
.sec-body { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.sec-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.kw { color: var(--cyan); font-weight: 700; }
.defn { border-left: 3px solid var(--cyan); padding: 10px 14px; background: rgba(53, 242, 224, .06); border-radius: 0 12px 12px 0; }
.defn b:first-child { font-family: var(--font-d); color: var(--cyan); }
.tip, .trap { padding: 12px 14px; border-radius: 14px; font-size: 14.5px; }
.tip { background: rgba(167, 139, 250, .1); border: 1px solid rgba(167, 139, 250, .3); }
.tip strong { color: var(--violet); }
.trap { background: rgba(255, 95, 210, .08); border: 1px solid rgba(255, 95, 210, .3); }
.trap strong { color: var(--pink); }
.order { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; font-family: var(--font-d); font-weight: 800; font-size: 22px; padding: 6px 0; }
.el { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; border: 1px solid; position: relative; }
.el small { position: absolute; bottom: 2px; font-family: var(--font-m); font-size: 8.5px; font-weight: 500; opacity: .8; }
.el.h { color: #fff; border-color: #fff; box-shadow: 0 0 14px rgba(255, 255, 255, .4); }
.el.c { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(53, 242, 224, .4); }
.el.o { color: var(--red); border-color: var(--red); box-shadow: 0 0 14px rgba(255, 107, 139, .4); }
.el.n { color: #6ea8ff; border-color: #6ea8ff; box-shadow: 0 0 14px rgba(110, 168, 255, .4); }
.gt { color: var(--muted); font-size: 18px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-d); font-size: 12px; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; }
.done-btn.on { color: var(--lime); border-color: var(--lime); box-shadow: 0 0 14px rgba(157, 255, 122, .3); }

/* Flashcards */
.flash { perspective: 1200px; cursor: pointer; }
.flash-in { position: relative; min-height: 190px; transition: transform .55s; transform-style: preserve-3d; }
.flash.flip .flash-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); }
.face.front { background: linear-gradient(140deg, rgba(53, 242, 224, .14), rgba(167, 139, 250, .12)); font-family: var(--font-d); font-size: 22px; font-weight: 700; }
.face.back { background: linear-gradient(140deg, rgba(167, 139, 250, .16), rgba(255, 95, 210, .1)); transform: rotateY(180deg); font-size: 16px; }

/* Test */
.opt-group { display: flex; flex-direction: column; gap: 8px; }
.lbl { font-family: var(--font-d); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.qnav { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.qn { flex: none; width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--muted); font-family: var(--font-m); font-size: 13px; cursor: pointer; }
.qn.ans { color: var(--fg); background: rgba(167, 139, 250, .18); border-color: rgba(167, 139, 250, .5); }
.qn.cur { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(53, 242, 224, .45); }
.qn.ok { background: rgba(157, 255, 122, .15); border-color: var(--lime); color: var(--lime); }
.qn.bad { background: rgba(255, 107, 139, .15); border-color: var(--red); color: var(--red); }
.qtext { font-size: 17px; font-weight: 600; white-space: pre-line; }
.opt { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--fg); font: inherit; font-size: 15px; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .2s; }
.opt:hover { border-color: rgba(53, 242, 224, .45); }
.opt .L { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-m); font-weight: 700; background: rgba(255, 255, 255, .06); }
.opt.sel { border-color: var(--violet); background: rgba(167, 139, 250, .12); box-shadow: 0 0 16px rgba(167, 139, 250, .3); }
.opt.sel .L { background: var(--violet); color: #12081f; }
.opt.right { border-color: var(--lime); background: rgba(157, 255, 122, .1); box-shadow: 0 0 16px rgba(157, 255, 122, .3); }
.opt.right .L { background: var(--lime); color: #0b1a05; }
.opt.wrong { border-color: var(--red); background: rgba(255, 107, 139, .1); }
.opt.wrong .L { background: var(--red); color: #22000a; }
.opt[disabled] { cursor: default; }
.explain { padding: 14px; border-radius: 14px; background: rgba(53, 242, 224, .06); border: 1px solid rgba(53, 242, 224, .25); font-size: 14.5px; display: flex; flex-direction: column; gap: 6px; }
.timer { font-family: var(--font-m); font-weight: 700; color: var(--cyan); text-shadow: 0 0 10px rgba(53, 242, 224, .6); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--red); text-shadow: 0 0 10px rgba(255, 107, 139, .7); }
.progress { height: 6px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink)); box-shadow: 0 0 10px var(--cyan); transition: width .4s; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.kpi { padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); text-align: center; }
.kpi b { display: block; font-family: var(--font-d); font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi.g b { color: var(--lime); } .kpi.r b { color: var(--red); } .kpi.y b { color: var(--amber); } .kpi.c b { color: var(--cyan); }
.score-ring { display: grid; place-items: center; position: relative; }
.score-ring svg { width: 170px; height: 170px; transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 12; }
.score-ring .val { position: absolute; text-align: center; }
.score-ring .val b { font-family: var(--font-d); font-size: 34px; display: block; line-height: 1; }

/* Figures */
.fig-box { overflow-x: auto; border-radius: 16px; background: rgba(5, 8, 20, .6); border: 1px solid var(--line); padding: 10px; }
.fig-box svg { display: block; width: 100%; min-width: 520px; height: auto; }
.fig-box.narrow svg { min-width: 300px; }
svg text { font-family: var(--font-b); }
.fnode { cursor: pointer; transition: opacity .25s; outline: none; }
.fnode:focus-visible rect { stroke-width: 3.5; }
.fnode rect { transition: filter .25s, stroke-width .25s; }
.fig-dim .fnode:not(.hl) { opacity: .2; }
.fig-dim .farrow:not(.hl) { opacity: .12; }
.farrow { transition: opacity .25s; }
.fnode.hl rect { stroke-width: 3; }
.lab-hidden .flabel { opacity: 0; }
.lab-hidden .fq { opacity: 1; }
.fq { opacity: 0; pointer-events: none; }
.lab-hidden .fnode.shown .flabel { opacity: 1; }
.lab-hidden .fnode.shown .fq { opacity: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.fig-points { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }

.list-item { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, .025); border: 1px solid var(--line); }
.empty { text-align: center; padding: 28px 18px; }
.empty svg { width: 64px; height: 64px; stroke: var(--lime); fill: none; stroke-width: 1.6; filter: drop-shadow(0 0 10px var(--lime)); }
.bar-row { display: flex; flex-direction: column; gap: 5px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 20; padding: 10px 18px; border-radius: 14px; background: rgba(13, 18, 38, .95); border: 1px solid var(--cyan); color: var(--fg); box-shadow: 0 0 20px rgba(53, 242, 224, .4); font-weight: 600; font-size: 14px; transition: .3s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confirm { border-color: rgba(255, 107, 139, .5); }
.steps { display: flex; gap: 5px; align-items: center; }
.steps i { width: 22px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .09); }
.steps i.on { background: linear-gradient(90deg, var(--cyan), var(--violet)); box-shadow: 0 0 8px rgba(53, 242, 224, .55); }
.steps i.gold { background: var(--lime); box-shadow: 0 0 8px rgba(157, 255, 122, .6); }
.deck { display: flex; flex-direction: column; gap: 10px; }
.deck.due { border-color: rgba(255, 95, 210, .55); box-shadow: 0 0 24px rgba(255, 95, 210, .18); }
.status { font-family: var(--font-m); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 9px; border: 1px solid; }
.status.due { color: var(--pink); border-color: rgba(255, 95, 210, .5); background: rgba(255, 95, 210, .1); animation: pulse 1.8s ease-in-out infinite; }
.status.new { color: var(--amber); border-color: rgba(255, 209, 102, .45); background: rgba(255, 209, 102, .08); }
.status.wait { color: var(--cyan); border-color: rgba(53, 242, 224, .4); background: rgba(53, 242, 224, .07); }
.status.gold { color: var(--lime); border-color: rgba(157, 255, 122, .45); background: rgba(157, 255, 122, .08); }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(255, 95, 210, .55); } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal div { border-radius: 12px; border: 1px solid var(--line); padding: 6px 2px; text-align: center; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; align-items: center; min-height: 64px; }
.cal div b { font-family: var(--font-d); font-size: 15px; color: var(--fg); }
.cal div.today { border-color: var(--cyan); box-shadow: 0 0 12px rgba(53, 242, 224, .3); }
.cal div em { font-style: normal; font-family: var(--font-m); font-size: 10px; font-weight: 700; color: #1a0016; background: var(--pink); border-radius: 6px; padding: 0 5px; box-shadow: 0 0 8px var(--pink); }
.next-card { text-align: center; align-items: center; border-color: rgba(53, 242, 224, .5); box-shadow: 0 0 30px rgba(53, 242, 224, .18); }
.next-card .when { font-family: var(--font-d); font-size: 26px; font-weight: 800; }
.qtimer { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.qtimer i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), var(--amber), var(--red)); transition: width 1s linear; }
@media (max-width: 440px) { .qtext { font-size: 16px; } .glass { padding: 15px; border-radius: 18px; } }
</style>

<div class="wrap">

    <button class="brand" id="home" aria-label="Home">

const SIMPLE = { f: "rgba(167,139,250,.16)", s: "#a78bfa" }, COMPLEX = { f: "rgba(53,242,224,.14)", s: "#35f2e0" };
function box(id, x, y, w, h, lines, kind) {
  const c = kind === "s" ? SIMPLE : COMPLEX, glow = kind === "s" ? "gv" : "gc";
  const ty = y + h / 2 - (lines.length - 1) * 10;
  return `<g class="fnode" data-n="${id}" tabindex="0" role="button" aria-label="${lines.join(" ")}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${c.f}" stroke="${c.s}" stroke-width="2" filter="url(#${glow})"/>
    <text class="flabel" x="${x + w / 2}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="#e9edff" font-size="17" font-weight="700">${lines.map((l, i) => `<tspan x="${x + w / 2}" dy="${i ? 20 : 0}">${l}</tspan>`).join("")}</text>
    <text class="fq" x="${x + w / 2}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="middle" fill="${c.s}" font-size="26" font-weight="800">?</text>
  </g>`;
}

function mastery(C) {
  const r = C.sections.filter((s) => S.reviewed[s.id]).length / C.sections.length;

  return Math.round((r * 0.3 + k * 0.2 + q * 0.5) * 100);
}

/* ---------- Recall (active recall + spaced repetition) ---------- */
const DAY = 86400000, IV = [1, 3, 7, 14, 30, 60], QSEC = 45;
const STEP_NAMES = ["New", "1 day", "3 days", "1 week", "2 weeks", "1 month", "2 months"];
const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const deckKey = (C, k) => C.id + ":" + k;
const deckOf = (C, k) => (S.srs || {})[deckKey(C, k)] || { stage: 0, next: 0, last: 0, hist: [] };
const isDue = (d) => d.last && Date.now() >= d.next;
const dueDecks = (C) => C.locked ? [] : Object.keys(C.topics).filter((k) => isDue(deckOf(C, k)));
function whenText(t) {
  const n = Math.round((dayStart(t) - dayStart(Date.now())) / DAY);
  const date = new Date(t).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  return n <= 0 ? "Today" : n === 1 ? `Tomorrow · ${date}` : `In ${n} days · ${date}`;
}
function steps(stage) { return `<span class="steps" aria-label="Step ${stage} of 6">${[1, 2, 3, 4, 5, 6].map((i) => `<i class="${i <= stage ? (stage === 6 ? "gold" : "on") : ""}"></i>`).join("")}</span>`; }
function deckStatus(d) {
  if (!d.last) return `<span class="status new">New</span>`;
  if (isDue(d)) return `<span class="status due">Due now</span>`;
  if (d.stage === 6) return `<span class="status gold">Locked in · next ${whenText(d.next)}</span>`;
  return `<span class="status wait">${whenText(d.next)}</span>`;
}
/* pct >= 80 moves up a step; 60–79 repeats the same gap; below 60 restarts at 1 day.
   Practising early never moves you up, but a score under 60 still resets the deck. */
function schedule(C, k, pct) {
  S.srs = S.srs || {};
  const d = deckOf(C, k), early = d.last && !isDue(d), before = d.stage;
  let stage = d.stage, days, kept = false;
  if (pct < 60) { stage = 0; days = 1; }
  else if (early) kept = true;
  else if (pct >= 80) { stage = Math.min(stage + 1, 6); days = IV[stage - 1]; }
  else days = IV[Math.max(stage - 1, 0)];
  const nd = { stage, next: kept ? d.next : dayStart(Date.now()) + days * DAY, last: Date.now(), hist: (d.hist || []).concat([{ at: Date.now(), pct }]).slice(-20) };
  S.srs[deckKey(C, k)] = nd;
  return { before, after: stage, next: nd.next, kept, early, pct, days };
}
function vRecall(C, el) {
  if (S.recallTimed === undefined) S.recallTimed = true;
  const keys = Object.keys(C.topics), due = dueDecks(C);
  const today = dayStart(Date.now());
  const cal = Array.from({ length: 14 }, (_, i) => {
    const t = today + i * DAY, n = keys.filter((k) => { const d = deckOf(C, k); return d.last && (i === 0 ? d.next <= t + DAY - 1 : dayStart(d.next) === t); }).length;
    const dt = new Date(t);
    return `<div class="${i ? "" : "today"}"><span>${dt.toLocaleDateString(undefined, { weekday: "short" })}</span><b>${dt.getDate()}</b>${n ? `<em>${n}</em>` : ""}</div>`;
  });
  const log = (S.recallLog || []).filter((x) => x.ch === C.id).slice(-8).reverse();
  el.innerHTML = `
  <section class="glass stack">
    <div class="row between"><h2 class="neon-text" style="display:inline-block">Active recall</h2>${due.length ? `<span class="status due">${due.length} due</span>` : `<span class="status wait">Nothing due</span>`}</div>
    <p class="small muted">Test yourself on one section with no notes, in real IMAT conditions: one clock for the whole test, answers and score only at the end (+1.5 / −0.4 / 0). The app then tells you when to come back. Score <b style="color:var(--lime)">80%+</b> to move up a step, <b style="color:var(--amber)">60–79%</b> repeats the same gap, <b style="color:var(--red)">under 60%</b> starts again tomorrow.</p>
    <div class="row small mono muted" style="gap:6px">${IV.map((d, i) => `<span class="badge ${i === 5 ? "ok" : "cy"}">${STEP_NAMES[i + 1]}</span>`).join('<span>›</span>')}</div>
    <div class="opt-group"><span class="lbl">IMAT timer · 100 s per question for the whole test</span><div class="row"><button class="chip ${S.recallTimed ? "on" : ""}" data-rt="1">On</button><button class="chip ${!S.recallTimed ? "on" : ""}" data-rt="0">Off</button></div></div>
  </section>
  ${keys.map((k) => {
    const d = deckOf(C, k), n = C.questions.filter((q) => q.t === k).length, last = (d.hist || []).slice(-1)[0];
    return `<section class="glass deck ${isDue(d) ? "due" : ""}">
      <div class="row between"><h3>${C.topics[k]}</h3>${deckStatus(d)}</div>
      <div class="row between small"><span class="row">${steps(d.stage)}<span class="muted">${d.stage ? "Step " + d.stage + "/6 · gap " + STEP_NAMES[d.stage] : "Not started"}</span></span><span class="muted mono">${n} Q · ${Math.floor(n * 100 / 60)}:${String(n * 100 % 60).padStart(2, "0")}${last ? ` · last ${last.pct}%` : ""}</span></div>
      <button class="btn ${!d.last || isDue(d) ? "primary" : ""} block" data-rc="${k}">${!d.last ? "Start first recall" : isDue(d) ? "Start recall now" : "Practise early"}</button>
      ${d.last && !isDue(d) ? `<p class="small muted">Practising early keeps your schedule. Only a score under 60% resets it.</p>` : ""}
    </section>`;
  }).join("")}
  <section class="glass stack"><h3>Next 14 days</h3><div class="cal">${cal.slice(0, 7).join("")}</div><div class="cal">${cal.slice(7).join("")}</div><p class="small muted">Pink numbers = sections due that day. Come back on those days to keep the memory fresh.</p></section>
  ${log.length ? `<section class="glass stack"><h3>Recent recall sessions</h3>${log.map((x) => `<div class="row between small" style="border-bottom:1px solid var(--line);padding-bottom:8px"><span class="mono muted">${new Date(x.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span><span>${C.topics[x.deck]}</span><span class="mono" style="color:${x.pct >= 80 ? "var(--lime)" : x.pct >= 60 ? "var(--amber)" : "var(--red)"}">${x.pct}%</span></div>`).join("")}</section>` : ""}`;
  el.querySelectorAll("[data-rt]").forEach((c) => (c.onclick = () => { S.recallTimed = c.dataset.rt === "1"; save(); render(); }));
  el.querySelectorAll("[data-rc]").forEach((b) => (b.onclick = () => { const k = b.dataset.rc; startTest(C, C.questions.filter((q) => q.t === k), "exam", S.recallTimed !== false, false, k); }));
}

const setup = { n: 20, mode: "exam", timer: true, topics: null };
function vTestSetup(C, el) {
  if (!setup.topics) setup.topics = new Set(Object.keys(C.topics));

    <div><h2 class="neon-text" style="display:inline-block">IMAT-style test</h2><p class="small muted">${C.questions.length} questions in the bank · 5 options (A–E) · one correct answer</p></div>
    <div class="opt-group"><span class="lbl">Number of questions</span><div class="row">${[10, 15, 20].map((x) => `<button class="chip ${setup.n === x ? "on" : ""}" data-n="${x}">${x}</button>`).join("")}</div></div>
    <div class="opt-group"><span class="lbl">Mode</span><div class="row"><button class="chip ${setup.mode === "exam" ? "on" : ""}" data-mode="exam">Exam: results at the end</button><button class="chip ${setup.mode === "practice" ? "on" : ""}" data-mode="practice">Practice: instant feedback</button></div></div>
    <div class="opt-group"><span class="lbl">Timer · IMAT pace 100 s per question</span><div class="row"><button class="chip ${setup.timer ? "on" : ""}" data-t="1">On</button><button class="chip ${!setup.timer ? "on" : ""}" data-t="0">Off</button></div></div>
    <div class="opt-group"><span class="lbl">Sections</span><div class="row">${Object.entries(C.topics).map(([k, v]) => `<button class="chip ${setup.topics.has(k) ? "on" : ""}" data-tp="${k}">${v} <span class="muted">${C.questions.filter((q) => q.t === k).length}</span></button>`).join("")}</div></div>
    <button class="btn primary block" id="go" ${pool.length ? "" : "disabled"}>Start test · ${n} questions${setup.timer ? ` · ${Math.round(n * 100 / 60)} min` : ""}</button>
  </section>
  <section class="glass stack">
    <h3>How IMAT scoring works</h3>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi g"><b>+1.5</b><span>correct</span></div><div class="kpi r"><b>−0.4</b><span>wrong</span></div><div class="kpi y"><b>0</b><span>blank</span></div></div>
    <p class="small muted">A blind guess among 5 options loses points on average (0.2 × 1.5 − 0.8 × 0.4 = −0.02). Guess only after you can rule out at least one option. Wrong and skipped questions go to Mistakes.</p>
  </section>`;
  el.querySelectorAll("[data-n]").forEach((c) => (c.onclick = () => { setup.n = +c.dataset.n; render(); }));
  el.querySelectorAll("[data-mode]").forEach((c) => (c.onclick = () => { setup.mode = c.dataset.mode; render(); }));
  el.querySelectorAll("[data-t]").forEach((c) => (c.onclick = () => { setup.timer = c.dataset.t === "1"; render(); }));
  el.querySelectorAll("[data-tp]").forEach((c) => (c.onclick = () => { const k = c.dataset.tp; setup.topics.has(k) ? setup.topics.delete(k) : setup.topics.add(k); render(); }));
  $("#go", el).onclick = () => startTest(C, shuffle(pool).slice(0, n), setup.mode, setup.timer);
}

function startTest(C, qs, mode, timer, fromMistakes = false, recall = null) {
  if (!qs.length) return toast("No questions here yet");
  const items = shuffle(qs).map((q) => { const order = q.fixed ? [0, 1, 2, 3, 4] : shuffle([0, 1, 2, 3, 4]); return { q, order }; });
  T = { ch: C.id, items, ans: items.map(() => null), cur: 0, mode, fromMistakes, done: false, end: timer ? Date.now() + items.length * 100000 : null, start: Date.now(), recall, qTimed: false, qEnds: {} };
  render();
}

/* ---------- Running test ---------- */
function renderTest() {
  const C = getCh(T.ch), it = T.items[T.cur], q = it.q, a = T.ans[T.cur];
  const prac = T.mode === "practice", locked = prac && a !== null;
  $("#tabs").hidden = true;
  $("#meta").textContent = T.recall ? "Recall · " + C.topics[T.recall] : T.fromMistakes ? "Mistakes practice" : prac ? "Practice" : "Exam";
  const qTimer = T.qTimed && a === null;
  if (qTimer && !T.qEnds[T.cur]) T.qEnds[T.cur] = Date.now() + QSEC * 1000;
  const answered = T.ans.filter((x) => x !== null).length;
  app.innerHTML = `
  <section class="glass stack" style="gap:10px">
    <div class="row between"><span class="mono small">Q ${T.cur + 1} / ${T.items.length}</span>${T.end || qTimer ? `<span class="timer" id="tm"></span>` : ""}<button class="btn" id="quit" style="padding:7px 12px;font-size:13px">End</button></div>
    <div class="progress"><i style="width:${pct(answered, T.items.length)}%"></i></div>
    <div class="qnav">${T.items.map((x, i) => { const v = T.ans[i]; let c = v !== null ? "ans" : ""; if (prac && v !== null) c = x.order[v] === x.q.a ? "ok" : "bad"; return `<button class="qn ${c} ${i === T.cur ? "cur" : ""}" data-j="${i}">${i + 1}</button>`; }).join("")}</div>
  </section>
  <section class="glass stack" style="gap:12px">
    ${qTimer ? `<div class="qtimer"><i id="qbar" style="width:100%"></i></div>` : ""}
    <span class="badge" style="align-self:flex-start">${C.topics[q.t]}</span>
    <div class="qtext">${esc(q.q)}</div>
    <div class="stack" style="gap:9px">${it.order.map((oi, k) => {
      let cls = a === k ? "sel" : "";
      if (locked) { if (oi === q.a) cls = "right"; else if (a === k) cls = "wrong"; }
      return `<button class="opt ${cls}" data-k="${k}" ${locked ? "disabled" : ""}><span class="L">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`;
    }).join("")}</div>
    ${locked ? `<div class="explain"><b style="color:${it.order[a] === q.a ? "var(--lime)" : "var(--red)"}">${a === "t" ? `Time's up · answer ${LET[it.order.indexOf(q.a)]}` : it.order[a] === q.a ? "Correct · +1.5" : `Wrong · −0.4 · answer ${LET[it.order.indexOf(q.a)]}`}</b><span>${esc(q.e)}</span><span class="small" style="color:var(--violet)"><b>Key note:</b> ${esc(q.tip)}</span></div>` : ""}
    ${!prac && a !== null ? `<button class="btn" id="clr" style="align-self:flex-start;font-size:13px;padding:7px 12px">Clear answer (leave blank)</button>` : ""}
    <div class="row between"><button class="btn" id="prev" ${T.cur ? "" : "disabled"}>‹ Prev</button>${T.cur < T.items.length - 1 ? `<button class="btn primary" id="next">Next ›</button>` : `<button class="btn primary" id="fin">Finish</button>`}</div>
  </section>
  <div id="confirmBox"></div>`;
  app.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { if (locked) return; clearInterval(timerH); T.ans[T.cur] = +b.dataset.k; renderTest(); }));
  app.querySelectorAll("[data-j]").forEach((b) => (b.onclick = () => { T.cur = +b.dataset.j; renderTest(); }));
  $("#prev").onclick = () => { T.cur--; renderTest(); };
  if ($("#next")) $("#next").onclick = () => { T.cur++; renderTest(); };
  if ($("#clr")) $("#clr").onclick = () => { T.ans[T.cur] = null; renderTest(); };
  const ask = (msg) => {
    $("#confirmBox").innerHTML = `<section class="glass confirm stack"><p>${msg}</p><div class="row"><button class="btn primary" id="yes">Finish and see results</button><button class="btn" id="no">Keep going</button></div></section>`;
    $("#yes").onclick = finishTest; $("#no").onclick = () => ($("#confirmBox").innerHTML = "");
    $("#confirmBox").scrollIntoView({ behavior: "smooth", block: "center" });
  };
  const blankN = T.ans.filter((x) => x === null).length;
  if ($("#fin")) $("#fin").onclick = () => (blankN ? ask(`${blankN} question(s) are blank and will score 0.`) : finishTest());
  $("#quit").onclick = () => ask(`End the test now? ${blankN} blank question(s) will score 0.`);
  clearInterval(timerH);
  if (qTimer) {
    const tick = () => {
      const ms = Math.max(0, T.qEnds[T.cur] - Date.now()), s = Math.ceil(ms / 1000), tm = $("#tm"), bar = $("#qbar");
      if (tm) { tm.textContent = `0:${String(s).padStart(2, "0")}`; tm.classList.toggle("low", s <= 10); }
      if (bar) bar.style.width = (ms / (QSEC * 10)) + "%";
      if (!ms) { clearInterval(timerH); T.ans[T.cur] = "t"; toast("Time's up"); renderTest(); }
    };
    tick(); timerH = setInterval(tick, 250);
  } else if (T.end) {
    const tick = () => { const s = Math.max(0, Math.round((T.end - Date.now()) / 1000)); const tm = $("#tm"); if (tm) { tm.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; tm.classList.toggle("low", s < 60); } if (!s) { clearInterval(timerH); toast("Time is up"); finishTest(); } };
    tick(); timerH = setInterval(tick, 1000);
  }
}
document.addEventListener("keydown", (e) => {
  if (!T || T.done || e.target.closest("input,textarea")) return;
  const k = e.key.toUpperCase(), idx = "ABCDE".indexOf(k) >= 0 ? "ABCDE".indexOf(k) : "12345".indexOf(e.key);
  const locked = T.mode === "practice" && T.ans[T.cur] !== null;
  if (idx >= 0 && !locked) { clearInterval(timerH); T.ans[T.cur] = idx; renderTest(); }
  else if (e.key === "ArrowRight" && T.cur < T.items.length - 1) { T.cur++; renderTest(); }
  else if (e.key === "ArrowLeft" && T.cur > 0) { T.cur--; renderTest(); }
});

function finishTest() {
  clearInterval(timerH);
  let c = 0, w = 0, b = 0;
  const per = {};
  T.items.forEach((it, i) => {
    const v = T.ans[i], id = it.q.id, st = (S.qs[id] = S.qs[id] || { c: 0, w: 0 });
    per[it.q.t] = per[it.q.t] || [0, 0]; per[it.q.t][1]++;
    if (v === null) { b++; S.mistakes[id] = { kind: "blank", at: Date.now() }; }
    else if (it.order[v] === it.q.a) { c++; st.c++; per[it.q.t][0]++; if (T.fromMistakes) delete S.mistakes[id]; }
    else { w++; st.w++; S.mistakes[id] = { kind: "wrong", at: Date.now() }; }
  });
  const score = c * 1.5 - w * 0.4, max = T.items.length * 1.5;
  T.res = { c, w, b, score, max, per, secs: Math.round((Date.now() - T.start) / 1000) };
  if (T.recall) {
    const C = getCh(T.ch), p = pct(c, T.items.length);
    T.res.sched = schedule(C, T.recall, p);
    S.recallLog = (S.recallLog || []).concat([{ ch: T.ch, deck: T.recall, at: Date.now(), pct: p }]).slice(-60);
  } else if (!T.fromMistakes) S.tests.push({ ch: T.ch, at: Date.now(), n: T.items.length, c, w, b, score, max, per });
  save();
  T.done = true; ui.rfilter = "wrong";
  render();
}

function qCard(it, v, num) {
  const q = it.q, mine = v === null ? null : v === "t" ? "t" : it.order[v];
  return `<div class="list-item">
    <div class="row between"><span class="badge">${num ? "Q" + num + " · " : ""}${getCh(T ? T.ch : ui.ch).topics[q.t]}</span>${mine === null ? '<span class="badge" style="color:var(--amber);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.1)">blank</span>' : mine === q.a ? '<span class="badge ok">correct</span>' : '<span class="badge pk">wrong</span>'}</div>
    <div class="qtext" style="font-size:15.5px">${esc(q.q)}</div>
    ${mine === "t" ? `<p class="small" style="color:var(--red)">Time ran out</p>` : mine !== null && mine !== q.a ? `<p class="small" style="color:var(--red)">Your answer: ${esc(q.o[mine])}</p>` : ""}
    <p class="small" style="color:var(--lime)">Correct: ${esc(q.o[q.a])}</p>
    <div class="explain"><span>${esc(q.e)}</span><span class="small" style="color:var(--violet)"><b>Key note:</b> ${esc(q.tip)}</span></div>
  </div>`;
}
function renderResults() {
  const C = getCh(T.ch), R = T.res, p = Math.max(0, pct(R.score, R.max)), r = 70, circ = 2 * Math.PI * r;
  $("#tabs").hidden = true; $("#meta").textContent = "Results";
  const list = T.items.map((it, i) => ({ it, v: T.ans[i], i })).filter((x) => ui.rfilter === "all" || x.v === null || x.it.order[x.v] !== x.it.q.a);
  const SC = R.sched;
  const recallCard = SC ? `<section class="glass stack next-card">
    <span class="lbl">${C.topics[T.recall]} · recall ${SC.pct}%</span>
    <p class="muted small">${SC.kept ? "Early practice: your schedule stays the same." : SC.after > SC.before ? "Step up. The gap gets longer." : SC.pct < 60 ? "Below 60%: this section starts again tomorrow." : "Same gap again to strengthen it."}</p>
    <span class="small muted">Come back for your next recall</span>
    <span class="when neon-text">${whenText(SC.next)}</span>
    <div class="row" style="justify-content:center">${steps(SC.after)}<span class="small muted">${SC.after === 6 ? "Locked in" : "Step " + SC.after + "/6"}</span></div>
  </section>` : "";
  app.innerHTML = `${recallCard}
  <section class="glass stack" style="align-items:center;text-align:center;gap:12px">
    <h2>${T.recall ? "Recall complete" : T.fromMistakes ? "Mistakes practice done" : "Test complete"}</h2>
    <div class="score-ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${r}" stroke="rgba(255,255,255,.08)"/><circle cx="85" cy="85" r="${r}" stroke="url(#sg)" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - p / 100)}" style="filter:drop-shadow(0 0 8px #35f2e0)"/><defs><linearGradient id="sg"><stop offset="0" stop-color="#35f2e0"/><stop offset="1" stop-color="#ff5fd2"/></linearGradient></defs></svg>
      <div class="val"><b>${R.score.toFixed(1)}</b><span class="small muted">of ${R.max.toFixed(1)}</span></div></div>
    <p class="muted small">${p >= 80 ? "Excellent. These pages are under control." : p >= 55 ? "Good. Review the key notes below to close the gaps." : "Go back to Review and Figures, then try again."} · ${Math.floor(R.secs / 60)}m ${R.secs % 60}s</p>
    <div class="kpis" style="width:100%"><div class="kpi g"><b>${R.c}</b><span>correct</span></div><div class="kpi r"><b>${R.w}</b><span>wrong</span></div><div class="kpi y"><b>${R.b}</b><span>blank</span></div><div class="kpi c"><b>${pct(R.c, T.items.length)}%</b><span>accuracy</span></div></div>
  </section>
  <section class="glass stack"><h3>By section</h3>${Object.entries(R.per).map(([k, [a, t]]) => `<div class="bar-row"><div class="row between small"><span>${C.topics[k]}</span><span class="mono muted">${a}/${t}</span></div><div class="progress"><i style="width:${pct(a, t)}%"></i></div></div>`).join("")}</section>
  <div class="row"><button class="btn primary" id="again">${T.recall ? "Back to Recall" : "New test"}</button><button class="btn" id="tomist">Go to Mistakes</button><button class="btn" id="out">Back to chapter</button></div>
  <section class="stack"><div class="row"><button class="chip ${ui.rfilter === "wrong" ? "on" : ""}" data-rf="wrong">Wrong &amp; blank</button><button class="chip ${ui.rfilter === "all" ? "on" : ""}" data-rf="all">All questions</button></div>
    ${list.length ? list.map((x) => qCard(x.it, x.v, x.i + 1)).join("") : `<div class="glass empty"><p>No mistakes in this test.</p></div>`}</section>`;
  app.querySelectorAll("[data-rf]").forEach((c) => (c.onclick = () => { ui.rfilter = c.dataset.rf; renderResults(); }));
  $("#again").onclick = () => { const back = T.recall ? "recall" : "test"; T = null; ui.tab = back; render(); };
  $("#tomist").onclick = () => { T = null; ui.tab = "mistakes"; render(); };
  $("#out").onclick = () => { T = null; ui.tab = "review"; render(); };
}

/* ---------- Figures ---------- */
function vFigures(C, el) {
  el.innerHTML = C.figures.map((F) => `
    <section class="glass stack" id="F-${F.id}">
      <div class="row between"><h3>${F.title}</h3>${F.interactive ? `<div class="row"><button class="chip ${ui.fig.hide ? "on" : ""}" data-hide="1">Label quiz</button><button class="chip" data-reset="1">Reset</button></div>` : ""}</div>
      <div class="fig-box ${F.interactive ? (ui.fig.hide ? "lab-hidden" : "") : ""}" data-fig="${F.id}">${FIG[F.draw]()}</div>
      ${F.interactive ? `<div class="legend"><span><i style="background:rgba(167,139,250,.3);border:2px solid #a78bfa"></i>simple biological molecules</span><span><i style="background:rgba(53,242,224,.25);border:2px solid #35f2e0"></i>complex biological molecules</span></div>
      <p class="small" id="figHint" style="color:var(--cyan)">${ui.fig.hide ? "Label quiz: say the name of each box, then tap it to check." : "Tap a box to light up its pathway."}</p>` : ""}
      <p class="muted">${F.caption}</p>
      <ul class="fig-points">${F.points.map((x) => `<li>${x}</li>`).join("")}</ul>
    </section>`).join("");
  const fb = el.querySelector('[data-fig="fig22"]');
  if (!fb) return;
  const svg = fb.querySelector("svg");
  const apply = () => {
    svg.querySelectorAll(".fnode").forEach((g) => { g.classList.toggle("shown", !!ui.fig.shown[g.dataset.n]); g.classList.remove("hl"); });
    svg.querySelectorAll(".farrow").forEach((a) => a.classList.remove("hl"));
    svg.classList.toggle("fig-dim", !!ui.fig.hl && !ui.fig.hide);
    if (ui.fig.hl && !ui.fig.hide) { const [ns, as] = PATHS[ui.fig.hl]; ns.forEach((n) => svg.querySelector(`[data-n="${n}"]`).classList.add("hl")); as.forEach((a) => svg.querySelector(`[data-a="${a}"]`).classList.add("hl")); }
  };
  svg.querySelectorAll(".fnode").forEach((g) => {
    const act = () => {
      if (ui.fig.hide) { ui.fig.shown[g.dataset.n] = true; const left = 9 - Object.keys(ui.fig.shown).length; $("#figHint").textContent = left ? `${left} label(s) left` : "All labels revealed. Tap Reset to try again."; }
      else ui.fig.hl = ui.fig.hl === g.dataset.n ? null : g.dataset.n;
      apply();
    };
    g.onclick = act; g.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } };
  });
  el.querySelector("[data-hide]").onclick = () => { ui.fig.hide = !ui.fig.hide; ui.fig.shown = {}; ui.fig.hl = null; vFigures(C, el); };
  el.querySelector("[data-reset]").onclick = () => { ui.fig.shown = {}; ui.fig.hl = null; vFigures(C, el); };
  apply();
}

/* ---------- Mistakes ---------- */
function vMistakes(C, el) {
  const ids = Object.keys(S.mistakes).filter((id) => C.questions.some((q) => q.id === id));
  const qs = ids.map((id) => C.questions.find((q) => q.id === id));
  if (!qs.length) {
    el.innerHTML = `<section class="glass empty stack" style="align-items:center"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg><h3>No mistakes saved</h3><p class="muted small">Wrong and skipped questions from your tests appear here with explanations and key notes. Answer one correctly in Mistakes practice to clear it.</p><button class="btn primary" id="gotest">Take a test</button></section>`;
    $("#gotest", el).onclick = () => { ui.tab = "test"; render(); };
    return;
  }
  const tips = [...new Set(qs.map((q) => q.tip))];
  el.innerHTML = `
  <section class="glass stack">
    <div class="row between"><h3>${qs.length} question(s) to fix</h3><button class="btn primary" id="pm">Practise mistakes</button></div>
    <p class="small muted">In practice mode you see the answer right away. Each correct answer removes that question from this list.</p>
  </section>
  <section class="glass stack"><h3 style="color:var(--violet)">Key notes from your mistakes</h3><ul class="fig-points">${tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></section>
  ${qs.map((q) => qCard({ q, order: [0, 1, 2, 3, 4] }, S.mistakes[q.id].kind === "blank" ? null : -1, 0).replace('<p class="small" style="color:var(--red)">Your answer: undefined</p>', "")).join("")}
  <button class="btn" id="clearAll">Clear all mistakes</button><div id="cc"></div>`;
  $("#pm", el).onclick = () => startTest(C, qs, "practice", false, true);
  $("#clearAll", el).onclick = () => {
    $("#cc", el).innerHTML = `<section class="glass confirm stack"><p>Remove all ${qs.length} saved mistakes for this chapter?</p><div class="row"><button class="btn primary" id="cy">Remove all</button><button class="btn" id="cn">Cancel</button></div></section>`;
    $("#cy", el).onclick = () => { ids.forEach((id) => delete S.mistakes[id]); save(); toast("Mistakes cleared"); render(); };
    $("#cn", el).onclick = () => ($("#cc", el).innerHTML = "");
  };
}

/* ---------- Progress ---------- */
function vProgress(C, el) {
  const tests = S.tests.filter((t) => t.ch === C.id);
  const rev = C.sections.filter((s) => S.reviewed[s.id]).length;
  const known = C.flashcards.filter((f, i) => S.known[C.id + ":" + i]).length;
  const mastered = C.questions.filter((q) => (S.qs[q.id] || {}).c > 0).length;
  const best = tests.length ? Math.max(...tests.map((t) => pct(t.score, t.max))) : 0;
  const avg = tests.length ? Math.round(tests.reduce((a, t) => a + Math.max(0, pct(t.score, t.max)), 0) / tests.length) : 0;
  const per = {}; Object.keys(C.topics).forEach((k) => (per[k] = [0, 0]));
  C.questions.forEach((q) => { const s = S.qs[q.id]; if (s) { per[q.t][0] += s.c; per[q.t][1] += s.c + s.w; } });
  const last = tests.slice(-10);
  const W = 640, H = 170, bw = 40, gap = last.length ? (W - 40) / last.length : 0;
  const chart = last.length ? `<div class="fig-box narrow" style="padding:8px"><svg viewBox="0 0 ${W} ${H + 30}" role="img" aria-label="Recent test scores">
    ${[0, 50, 100].map((v) => `<line x1="30" x2="${W}" y1="${H - (v / 100) * (H - 20)}" y2="${H - (v / 100) * (H - 20)}" stroke="rgba(140,160,255,.15)"/><text x="24" y="${H - (v / 100) * (H - 20) + 4}" fill="#98a0c8" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">${v}</text>`).join("")}
    ${last.map((t, i) => { const v = Math.max(0, pct(t.score, t.max)), h = (v / 100) * (H - 20), x = 40 + i * gap + (gap - bw) / 2; return `<rect x="${x}" y="${H - h}" width="${bw}" height="${Math.max(h, 2)}" rx="8" fill="${i === last.length - 1 ? "#35f2e0" : "rgba(167,139,250,.55)"}" ${i === last.length - 1 ? 'filter="url(#pg)"' : ""}/><text x="${x + bw / 2}" y="${H - h - 6}" text-anchor="middle" fill="#e9edff" font-size="11.5" font-family="JetBrains Mono,monospace">${v}%</text><text x="${x + bw / 2}" y="${H + 18}" text-anchor="middle" fill="#98a0c8" font-size="11" font-family="JetBrains Mono,monospace">#${tests.length - last.length + i + 1}</text>`; }).join("")}
    <defs><filter id="pg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg></div>` : `<p class="small muted">Take a test to see your score chart.</p>`;
  el.innerHTML = `
  <section class="glass stack" style="align-items:center;text-align:center">
    ${ring(mastery(C), 120)}
    <h3>Chapter mastery</h3><p class="small muted">30% notes reviewed · 20% flashcards known · 50% questions answered correctly at least once</p>
  </section>
  <section class="glass stack">
    <div class="bar-row"><div class="row between small"><span>Notes reviewed</span><span class="mono muted">${rev}/${C.sections.length}</span></div><div class="progress"><i style="width:${pct(rev, C.sections.length)}%"></i></div></div>
    <div class="bar-row"><div class="row between small"><span>Flashcards known</span><span class="mono muted">${known}/${C.flashcards.length}</span></div><div class="progress"><i style="width:${pct(known, C.flashcards.length)}%"></i></div></div>
    <div class="bar-row"><div class="row between small"><span>Questions mastered</span><span class="mono muted">${mastered}/${C.questions.length}</span></div><div class="progress"><i style="width:${pct(mastered, C.questions.length)}%"></i></div></div>
  </section>
  <section class="glass stack"><h3>Tests</h3>
    <div class="kpis"><div class="kpi c"><b>${tests.length}</b><span>tests taken</span></div><div class="kpi g"><b>${best}%</b><span>best score</span></div><div class="kpi y"><b>${avg}%</b><span>average</span></div></div>
    ${chart}
  </section>
  <section class="glass stack"><h3>Accuracy by section</h3>
    ${Object.entries(C.topics).map(([k, v]) => `<div class="bar-row"><div class="row between small"><span>${v}</span><span class="mono muted">${per[k][1] ? pct(per[k][0], per[k][1]) + "%" : "not tried"}</span></div><div class="progress"><i style="width:${pct(per[k][0], per[k][1])}%"></i></div></div>`).join("")}
  </section>
  ${tests.length ? `<section class="glass stack"><h3>History</h3>${tests.slice().reverse().slice(0, 12).map((t) => `<div class="row between small" style="border-bottom:1px solid var(--line);padding-bottom:8px"><span class="mono muted">${new Date(t.at).toLocaleDateString()} ${new Date(t.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span><span>${t.n} Q · <b style="color:var(--lime)">${t.c}</b>/<b style="color:var(--red)">${t.w}</b>/<b style="color:var(--amber)">${t.b}</b></span><span class="mono" style="color:var(--cyan)">${t.score.toFixed(1)} / ${t.max.toFixed(1)}</span></div>`).join("")}</section>` : ""}
  <section class="glass stack"><p class="small muted">Progress is saved in this browser on this device.</p><button class="btn" id="reset" style="align-self:flex-start">Reset chapter progress</button><div id="rc"></div></section>`;
  $("#reset", el).onclick = () => {
    $("#rc", el).innerHTML = `<div class="row"><button class="btn primary" id="ry">Yes, reset everything</button><button class="btn" id="rn">Cancel</button></div>`;
    $("#ry", el).onclick = () => {
      C.sections.forEach((s) => delete S.reviewed[s.id]); C.flashcards.forEach((f, i) => delete S.known[C.id + ":" + i]);
      C.questions.forEach((q) => { delete S.qs[q.id]; delete S.mistakes[q.id]; }); S.tests = S.tests.filter((t) => t.ch !== C.id);
      Object.keys(C.topics).forEach((k) => S.srs && delete S.srs[deckKey(C, k)]); S.recallLog = (S.recallLog || []).filter((x) => x.ch !== C.id);
      save(); toast("Progress reset"); render();
    };
    $("#rn", el).onclick = () => ($("#rc", el).innerHTML = "");
  };
}

/* Android Back button: returns true when the app handled it */
window.appBack = () => {
  if (T && !T.done) { toast("Tap End to finish the test"); return true; }
  if (T && T.done) { T = null; render(); return true; }
  if (ui.ch && ui.tab !== "review") { ui.tab = "review"; render(); return true; }
  if (ui.ch) { ui.ch = null; render(); return true; }
  return false;
};
$("#home").onclick = () => { if (T && !T.done) return toast("Finish or end the test first"); T = null; ui.ch = null; render(); };
render();
</script>
</body></html>
