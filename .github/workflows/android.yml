name: Build Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        id: gradle1
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Gradle (retry)
        id: gradle2
        if: steps.gradle1.outcome == 'failure'
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # If the Gradle download server is down, use the runner's preinstalled
      # Gradle 9 together with an Android plugin version that supports it.
      - name: Choose build tooling
        run: |
          if [ "${{ steps.gradle1.outcome }}" = "failure" ] && [ "${{ steps.gradle2.outcome }}" != "success" ]; then
            echo "AGP_ARGS=-PagpVersion=9.0.0" >> "$GITHUB_ENV"
            echo "Using preinstalled Gradle $(gradle --version | grep Gradle) with AGP 9.0.0"
          else
            echo "AGP_ARGS=" >> "$GITHUB_ENV"
          fi

      # Signing key: from repository secrets if set (KEYSTORE_BASE64 + KEYSTORE_PASSWORD),
      # otherwise a key generated once on the runner and kept in the Actions cache.
      # It is never committed to the repository.
      - name: Restore cached signing key
        if: ${{ env.HAS_SECRET != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.bioglow-key
          key: bioglow-signing-key-v1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            PASS="$KS_PASS"; ALIAS="${{ secrets.KEY_ALIAS || 'bioglow' }}"
          else
            mkdir -p ~/.bioglow-key
            if [ ! -f ~/.bioglow-key/release.keystore ]; then
              openssl rand -hex 16 > ~/.bioglow-key/pass
              keytool -genkeypair -keystore ~/.bioglow-key/release.keystore -alias bioglow \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BioGlow IMAT" \
                -storepass "$(cat ~/.bioglow-key/pass)" -keypass "$(cat ~/.bioglow-key/pass)"
            fi
            cp ~/.bioglow-key/release.keystore "$RUNNER_TEMP/release.keystore"
            PASS="$(cat ~/.bioglow-key/pass)"; ALIAS=bioglow
          fi
          echo "::add-mask::$PASS"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Copy web app into the APK assets
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp -r index.html manifest.webmanifest css js data icons "$W"/

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon $AGP_ARGS

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CambridgeBio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CambridgeBio-apk
          path: CambridgeBio.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BioGlow IMAT v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: CambridgeBio.apk
          body: |
            Android build of BioGlow IMAT (Cambridge Biology for IMAT).
            Download CambridgeBio.apk below and open it on your phone to install.
